gap_follow:
  ros__parameters:
    control_rate_hz: 50.0              # [Hz] 제어 루프 실행 주기. 50Hz = 0.02초마다 1번 실행. 너무 낮으면 반응이 느리고, 너무 높으면 노이즈에 민감해질 수 있음.

    # =========================
    # E-STOP
    # =========================
    estop_stop_distance: 0.1           # [m] 이 거리보다 가까운 장애물이 전방에 있으면 즉시 정지. 충돌이 걱정되면 키우고, 너무 자주 멈추면 줄임.
    estop_fov_deg: 25.0                # [deg] E-stop이 감시하는 전방 시야각. 30도면 대략 정면 기준 ±15도. 커브에서 자꾸 멈추면 줄이고, 정면 장애물을 놓치면 늘림.
    estop_ttc_threshold: 0.35          # [s] TTC(Time-To-Collision) 기준 시간. 이 시간보다 빨리 충돌할 것으로 예상되면 정지. 민감하면 줄이고, 늦게 멈추면 늘림.
    estop_max_range: 10.0              # [m] E-stop 계산에 사용할 최대 라이다 거리. 보통 센서 최대 유효거리 수준으로 둠.
    estop_min_speed: 0.1               # [m/s] 이 속도보다 매우 느리면 TTC 기반 정지를 덜 민감하게 볼 수 있음. 저속에서 쓸데없이 멈추면 줄여볼 수 있음.
    estop_use_dynamic_center: true     # [bool] 조향 방향에 따라 E-stop의 기준 정면을 움직일지 여부. 커브에서 정면을 유동적으로 보게 해 불필요한 정지를 줄이는 용도.
    estop_center_gain: 0.65            # [-] 현재 조향각을 얼마나 E-stop 중심 이동에 반영할지 정하는 비율. 커브에서 과하게 반응하면 줄이고, 커브 대응이 둔하면 약간 늘림.
    estop_max_center_shift_deg: 40.0   # [deg] E-stop 중심을 최대 몇 도까지 옮길지 제한. 커브에서 자꾸 정지하면 늘리고, 너무 옆까지 봐서 위험하면 줄임.

    # =========================
    # GAP FOLLOW
    # =========================
    gf_speed: 2.0                      # [m/s] 기본 목표 주행 속도. 전체적으로 흔들리거나 코너에서 불안하면 낮추고, 직선에서 너무 느리면 높임.
    gf_max_steer: 0.6                  # [rad] 최대 조향각. 약 22.9도. 코너를 못 돌면 늘리고, 조향이 과격하면 줄임.
    gf_max_range: 10.0                 # [m] Gap follow가 사용할 최대 라이다 거리. 너무 먼 값까지 반영하지 않도록 제한하는 용도.
    gf_front_angle_deg: 70.0           # [deg] Gap을 찾을 전방 시야 범위. 너무 넓으면 옆 공간까지 과하게 보고, 너무 좁으면 코너 판단이 둔해짐.
    gf_min_gap_size: 6                 # [index count] gap으로 인정할 최소 연속 라이다 포인트 개수. 작은 노이즈 틈을 무시하려면 키우고, 좁은 통로도 지나가려면 줄임.
    gf_min_valid_range: 0.05           # [m] 이 거리보다 작은 라이다 값은 무효로 처리. 노이즈 제거용. 센서 노이즈가 많으면 약간 키울 수 있음.

    # =========================
    # SPEED
    # =========================
    gf_corner_speed_scale: 0.5         # [-] 조향이 커질수록 속도를 얼마나 줄일지 정하는 비율. 코너에서 빠르고 불안하면 키우고, 너무 느려지면 줄임.
    gf_min_speed: 1.0                  # [m/s] 최소 속도 하한. 너무 낮으면 차가 버벅일 수 있어 일정 속도 이하로는 안 떨어지게 함.
    gf_close_distance: 0.7             # [m] 전방 장애물이 이 거리보다 가까워지면 감속을 더 시작하는 기준. 코너/장애물 대응이 늦으면 키움.
    gf_very_close_distance: 0.5        # [m] 매우 가까운 장애물 기준. 이 거리 이내면 더 강하게 감속. 좁은 구간에서 불안하면 키움.
    gf_close_speed: 1.5                # [m/s] 장애물이 가까울 때 적용할 제한 속도. 좁은 구간에서도 빠르면 줄임.
    gf_very_close_speed: 0.8           # [m/s] 장애물이 매우 가까울 때 적용할 더 낮은 속도. 안전성을 높이려면 줄임.

    # =========================
    # VEHICLE GEOMETRY
    # =========================
    use_vehicle_geometry: true         # [bool] 차량 크기를 고려해 bubble 반경 등을 계산할지 여부. 실제 차 폭 반영에 중요.
    vehicle_width: 0.30                # [m] 차량 폭. 실제 차량보다 작게 잡으면 위험하고, 크게 잡으면 보수적으로 주행함.
    vehicle_length: 0.50               # [m] 차량 길이. 시각화나 기하적 판단 참고용.
    vehicle_wheelbase: 0.33            # [m] 앞뒤 축간 거리. 조향/기구학 해석에 중요한 실제 차량 파라미터.
    vehicle_safety_margin: 0.05        # [m] 차량 외곽에 추가로 둘 안전 여유. 벽과 너무 가까우면 늘리고, 너무 보수적이면 줄임.

    # =========================
    # CORNER BIAS
    # =========================
    gf_use_corner_bias: true           # [bool] 코너라고 판단되면 gap 중앙이 아니라 코너 방향 쪽으로 best point를 치우쳐 선택할지 여부.
    gf_center_sector_deg: 12.0         # [deg] 정면 중앙 구간의 폭. turn hint를 계산할 때 정면 개방도를 보는 기준 구간.
    gf_side_sector_start_deg: 20.0     # [deg] 좌/우 측면 구간 시작 각도. turn hint 판단용 측면 영역 시작점.
    gf_side_sector_end_deg: 70.0       # [deg] 좌/우 측면 구간 끝 각도. turn hint 판단용 측면 영역 끝점.
    gf_turn_open_ratio: 1.25           # [-] 측면이 정면보다 이 비율 이상 더 열려 있어야 좌/우 회전 힌트로 인정. 힌트가 자주 바뀌면 키움.
    gf_turn_diff_min: 0.8              # [m] 좌우 개방도 차이가 최소 이 값 이상이어야 확실한 turn hint로 인정. 좌우 흔들리면 키움.
    gf_corner_bias_ratio: 0.78         # [-] 코너 방향일 때 gap 안에서 어느 쪽으로 치우쳐 best point를 고를지 정하는 비율. 너무 공격적이면 줄임.

    # =========================
    # ASYMMETRIC FOV
    # =========================
    gf_use_asymmetric_fov: true        # [bool] 좌/우 회전 힌트에 따라 좌우 탐색 시야를 다르게 둘지 여부. 레이싱 코스에서 유용할 수 있음.
    gf_left_fov_deg_nominal: 70.0      # [deg] 평상시 왼쪽 탐색 시야각.
    gf_right_fov_deg_nominal: 70.0     # [deg] 평상시 오른쪽 탐색 시야각.
    gf_left_fov_deg_turn: 85.0         # [deg] 좌회전 힌트일 때 넓게 볼 왼쪽 시야각.
    gf_right_fov_deg_turn: 40.0        # [deg] 좌회전 힌트일 때 좁게 볼 오른쪽 시야각. 좌우 차이가 너무 크면 조향이 출렁일 수 있음.

    # =========================
    # RACING DIRECTION PRIOR
    # =========================
    race_follow_side: right            # [string] 기준으로 따라갈 벽 방향. right면 오른쪽 벽 기준, left면 왼쪽 벽 기준.
    wf_target_dist: 0.6                # [m] 벽과 유지하고 싶은 목표 거리. 벽에 너무 붙으면 늘리고, 더 안쪽 라인을 타고 싶으면 줄일 수 있음.
    wf_kp: 0.9                         # [rad/m] 벽 거리 오차를 조향각으로 바꾸는 비례 이득(P gain). 너무 자잘하게 조향 수정하면 줄이고, 벽을 못 잡으면 늘림.
    wf_max_steer: 0.30                 # [rad] wall-follow 보조 조향의 최대값 제한. 벽 기준 보정이 너무 강하면 줄임.
    wf_theta_deg: 50.0                 # [deg] wall-follow 계산 시 두 라이다 빔 사이 각도. 보통 45~60도 부근 사용.
    wf_right_angle_b_deg: -90.0        # [deg] 오른쪽 벽 기준으로 사용할 기준 빔 각도. 오른쪽 옆면 방향을 보는 값.
    wf_left_angle_b_deg: 90.0          # [deg] 왼쪽 벽 기준으로 사용할 기준 빔 각도. 왼쪽 옆면 방향을 보는 값.
    wf_lookahead: 0.6                  # [m] 현재 거리뿐 아니라 약간 앞에서의 벽 거리까지 예측하는 lookahead 거리. 부드럽게 하려면 보통 약간 늘림.
    wf_min_valid_dist: 0.15            # [m] wall-follow 계산에 사용할 최소 유효 거리. 너무 가까운 비정상 값 제거용.
    wf_max_valid_dist: 6.0             # [m] wall-follow 계산에 사용할 최대 유효 거리. 너무 먼 값은 벽이라고 보기 어려워 제한.

    # =========================
    # HYBRID SWITCH
    # =========================
    hybrid_nearest_dist_threshold: 1.5 # [m] 가장 가까운 장애물이 이보다 가까우면 wall-follow보다 gap-follow를 더 우선하는 기준.
    hybrid_gap_width_threshold: 1.00   # [m] gap 폭이 이보다 좁으면 더 적극적으로 gap-follow override를 쓰는 기준.
    hybrid_gap_override_steer_deg: 10.0 # [deg] gap-follow가 요구하는 조향이 이 각도보다 크면 wall-follow보다 gap-follow를 우선하기 쉬움.
    hybrid_disable_wall_on_turn_hint: true # [bool] 좌/우 회전 힌트가 확실할 때 wall-follow 개입을 꺼서 코너에서 wall 과개입을 막음.
    hybrid_wall_weight: 0.4            # [-] blend 모드에서 wall-follow 보조 조향 비중. 벽을 너무 열심히 잡으면 더 낮춤.
    hybrid_gap_weight: 0.7             # [-] blend 모드에서 gap-follow 조향 비중. 레이싱에서는 보통 이 비중이 wall보다 크거나 비슷한 편이 자연스러움.

    # =========================
    # STEER RATE LIMIT
    # =========================
    gf_use_steer_rate_limit: true      # [bool] 조향각이 한 번에 급격히 바뀌지 않도록 변화율 제한을 사용할지 여부.
    gf_max_steer_rate: 1.4             # [rad/s] 조향각 변화 최대 속도. 낮추면 더 부드럽고, 너무 낮추면 급코너 대응이 늦어짐.

    # =========================
    # VIS
    # =========================
    viz_frame: base_link               # [frame id] 시각화 마커를 표시할 기준 프레임.
    viz_best_point_topic: /gf/best_point_marker    # [topic] 선택된 best point 마커 토픽.
    viz_nearest_point_topic: /gf/nearest_point_marker # [topic] 가장 가까운 장애물 점 마커 토픽.
    viz_bubble_topic: /gf/bubble_marker            # [topic] bubble 영역 시각화 토픽.
    viz_gap_topic: /gf/gap_marker                  # [topic] 선택된 gap 시각화 토픽.
    viz_footprint_topic: /gf/footprint_marker      # [topic] 차량 footprint 시각화 토픽.
    viz_fov_topic: /gf/fov_marker                  # [topic] 현재 탐색 시야(FOV) 시각화 토픽.


wall_follow:
  ros__parameters:
    control_rate_hz: 50.0              # [Hz] 제어 루프 주기. 50Hz = 0.02초마다 실행.

    # =========================
    # E-STOP
    # =========================
    estop_stop_distance: 0.8           # [m] 이 거리보다 가까운 장애물이 있으면 즉시 정지. wall-follow는 벽 가까이 가므로 gap-follow보다 조금 크게 둘 수도 있음.
    estop_fov_deg: 10.0                # [deg] E-stop 전방 감시 범위. 너무 넓으면 벽을 장애물로 과민하게 볼 수 있어 좁게 둔 경우.
    estop_ttc_threshold: 0.35          # [s] TTC 기준 시간.
    estop_max_range: 10.0              # [m] E-stop 계산 최대 거리.
    estop_min_speed: 0.1               # [m/s] 매우 저속일 때 TTC 민감도를 낮추는 기준 속도.

    # =========================
    # WALL FOLLOW
    # =========================
    wf_target_dist: 0.6                # [m] 벽과 유지할 목표 거리.
    wf_kp: 1.4                         # [rad/m] 비례 이득(P). 현재 오차에 대한 반응 크기. 너무 출렁이면 낮춤.
    wf_kd: 0.09                        # [rad/(m/s)] 미분 이득(D). 오차 변화 속도에 반응해 진동을 줄이는 역할. 너무 작으면 효과 없고, 너무 크면 둔해질 수 있음.
    wf_ki: 0.01                        # [rad/(m·s)] 적분 이득(I). 오랜 시간 누적된 거리 오차를 보정. 너무 크면 누적되어 갑자기 크게 꺾을 수 있음.
    wf_speed: 2.0                      # [m/s] 기본 wall-follow 주행 속도.
    wf_max_steer: 0.6                  # [rad] wall-follow 최대 조향각.
    wf_lookahead: 0.4                  # [m] 미래 벽 거리 예측을 위한 lookahead 거리.
    wf_min_speed: 0.55                 # [m/s] 너무 느려지지 않도록 하는 최소 속도.

    # =========================
    # GEOMETRY
    # =========================
    wf_theta_deg: 50.0                 # [deg] wall-follow 두 라이다 빔 간 각도.
    wf_angle_b_deg: -90.0              # [deg] 기준 벽 방향 라이다 빔 각도. -90도면 오른쪽 옆면.
    wf_front_angle_deg: 0.0            # [deg] 정면 거리 확인용 각도.
    wf_front_right_angle_deg: -20.0    # [deg] 정면-오른쪽 방향 확인용 각도. 코너/벽 접근 판단에 사용 가능.

    # =========================
    # CORNER HANDLING
    # =========================
    corner_enter_a_threshold: 4.7      # [m] 특정 방향의 벽 거리 a가 이 값 이상이면 코너 진입으로 해석할 수 있는 기준.
    corner_exit_a_threshold: 4.1       # [m] 코너를 빠져나올 때 사용할 종료 기준 거리.
    corner_front_threshold: 1.5        # [m] 정면 거리가 이 값보다 짧으면 코너/급회전 판단에 활용 가능.
    corner_b_threshold: 2.2            # [m] 옆 벽 거리 b 기준. 코너 상황 판단에 사용.

    corner_sharp_steer: -0.30          # [rad] 급한 코너에서 사용할 강한 조향 명령.
    corner_sharp_speed: 0.40           # [m/s] 급한 코너에서 사용할 낮은 속도.
    corner_medium_steer: -0.24         # [rad] 중간 정도 코너에서 사용할 조향 명령.
    corner_medium_speed: 0.48          # [m/s] 중간 정도 코너에서 사용할 속도.
    corner_soft_steer: -0.16           # [rad] 완만한 코너에서 사용할 조향 명령.
    corner_soft_speed: 0.55            # [m/s] 완만한 코너에서 사용할 속도.

    # =========================
    # CLAMP
    # =========================
    integral_clip: 0.20                # [rad] 적분항(I term) 최대 제한값. 적분 누적 폭주(windup)를 막기 위한 제한.
    derivative_clip: 3.0               # [rad/s] 미분항(D term) 최대 제한값. 순간적인 노이즈로 D가 너무 커지는 것을 방지.

    # =========================
    # SMOOTHING
    # =========================
    steer_smoothing_alpha: 0.18        # [-] 조향 저역통과필터 계수. 값을 키우면 더 최근 명령을 많이 반영하고, 너무 낮으면 반응이 둔해질 수 있음.
    speed_smoothing_alpha: 0.20        # [-] 속도 저역통과필터 계수. 속도 변화가 너무 급하면 조정.