gap_follow:
  ros__parameters:
    # 이 섹션은 `controller/gapfollow.py`가 실제로 읽는 파라미터만 남겨 정리한 버전이다.
    # launch 기준으로 `ros2 launch stack_master reactive.launch.xml mode:=gap`일 때 사용된다.
    # 핵심 흐름:
    # 1) scan 전처리 -> 2) 전방 장애물 선택 -> 3) bubble 적용
    # 4) lookahead 선택 -> 5) true gap 계산 -> 6) gap 중심으로 조향/감속

    control_rate_hz: 50.0              # [Hz] 제어 루프 주기. 50Hz면 0.02초마다 gap을 다시 계산한다.

    # =========================
    # CORE DRIVE
    # =========================
    gf_speed: 1.0                      # [m/s] 충분히 열린 gap에서 목표로 하는 기본 속도. 전체 공격성을 가장 크게 좌우한다.
    gf_min_speed: 1.0                  # [m/s] 큰 조향/근접 장애물 상황에서도 유지할 최소 속도. 너무 높으면 좁은 구간에서 불안하고, 너무 낮으면 답답해진다.
    gf_max_steer: 0.6                  # [rad] 최종 조향 제한. 급코너에서 안쪽으로 더 빨리 꺾고 싶을 때 키우지만, 서보 한계와 맞아야 한다.
    gf_safe_distance: 3.0              # [m] nearest obstacle이 이 거리쯤이면 "충분히 안전"하다고 보고 감속 비중을 줄인다.
    gf_steer_speed_gain: 0.75          # [-] steering이 커질수록 속도를 얼마나 줄일지 결정. 값이 크면 코너 진입이 더 보수적이다.

    # =========================
    # LIDAR PREPROCESSING
    # =========================
    gf_max_range: 10.0                 # [m] inf 대체 및 1차 clip 상한. `gf_distance_cap`보다 작으면 cap이 사실상 무효가 되므로 더 크게 둔다.
    gf_distance_cap: 8.5               # [m] gap 계산에 실제로 반영할 최종 최대 거리. 먼 opening을 더 보되, 너무 멀리 끌려가지 않게 제한한다.
    gf_min_valid_range: 0.05           # [m] 이보다 작은 beam은 노이즈/자기차체 근접값으로 보고 제거한다.

    # =========================
    # TWO FOVS
    # =========================
    gf_gap_fov_deg: 170.0              # [deg] gap 탐색용 넓은 시야. 옆쪽 코너 입구를 빨리 보고 싶을수록 넓게 둔다.
    gf_nearest_fov_deg: 40.0           # [deg] nearest obstacle 탐색용 좁은 시야. 너무 넓으면 옆 벽이 bubble 중심으로 잡힐 수 있다.

    # =========================
    # BUBBLE / OBSTACLE
    # =========================
    gf_bubble_radius: 0.4              # [m] 선택된 nearest obstacle 주변에서 지워버릴 안전 반경. 너무 작으면 스치듯 지나가려 하고, 너무 크면 gap이 사라진다.
    gf_obstacle_trigger_dist: 3.5      # [m] 이 거리 안쪽 beam만 위협 obstacle 후보로 본다. 멀리 있는 물체까지 bubble을 만들지 않기 위한 기준.
    gf_obstacle_cluster_tolerance: 0.20  # [m] 같은 obstacle cluster로 묶을 수 있는 range 변화 허용치. 너무 작으면 하나의 장애물이 여러 조각으로 쪼개진다.
    gf_obstacle_cluster_min_beams: 8   # [beam] cluster로 인정할 최소 연속 beam 수. 노이즈 억제에는 유리하지만 너무 크면 가느다란 장애물을 놓칠 수 있다.
    gf_obstacle_max_center_angle_deg: 18.0  # [deg] 정면에 가까운 장애물만 bubble 중심 후보로 사용. 옆벽 영향 억제를 위한 조건.

    # =========================
    # LOOKAHEAD TRUE GAP
    # =========================
    gf_use_dynamic_lookahead: true     # [bool] 속도에 따라 lookahead를 늘릴지 여부. 빠를수록 부드럽게, 느릴수록 민첩하게 반응한다.
    gf_lookahead_base: 1.5             # [m] 기본 lookahead 거리. 짧을수록 코너에는 빠르지만 직선에서 흔들릴 수 있다.
    gf_lookahead_speed_gain: 0.25      # [m/(m/s)] 속도 증가에 따라 lookahead를 얼마나 늘릴지 결정. 너무 크면 고속에서 코너 반응이 둔해진다.
    gf_lookahead_min: 0.8              # [m] lookahead 하한. 너무 짧아져 지그재그 반응이 나오지 않게 한다.
    gf_lookahead_max: 1.6              # [m] lookahead 상한. 급코너 반응성을 위해 비교적 짧게 묶어 둔 값이다.
    gf_use_corner_lookahead: true      # [bool] 급코너를 감지하면 일반 lookahead 대신 짧은 전용 lookahead를 사용한다.
    gf_corner_lookahead: 0.75          # [m] 급코너 모드에서 사용할 짧은 lookahead. 안쪽으로 더 빨리 회전하고 싶을 때 줄인다.
    gf_corner_trigger_dist: 2.0        # [m] 정면이 이 정도로 가까워져야 코너 후보로 판단한다.
    gf_corner_open_diff_dist: 0.5      # [m] 좌우 opening 평균 차이가 이 값보다 커야 "한쪽이 더 열린 코너"로 본다.
    gf_corner_side_angle_deg: 65.0     # [deg] 좌우 opening을 비교할 중심 각도. 코너 옆 공간을 어디서 볼지 정하는 값이다.
    gf_corner_sector_width_deg: 20.0   # [deg] opening 평균을 낼 sector 폭. 너무 좁으면 노이즈에 민감하고, 너무 넓으면 방향성이 흐려진다.

    # =========================
    # TRUE GAP VALIDITY / SCORING
    # =========================
    gf_min_gap_beams: 6                # [beam] 연속된 beam 수가 이보다 적으면 gap 후보에서 제외한다.
    gf_vehicle_safety_margin: 0.10     # [m] 차량 폭 양쪽에 추가로 요구할 여유 폭. 보수적으로 가려면 키우고, 지나치게 멈추면 줄인다.
    gf_gap_heading_weight: 0.08        # [-] gap 중심 각도가 클수록 주는 penalty. 현재는 약하게 둬서 코너 방향 gap도 잘 선택하도록 한 상태다.
    gf_forward_gap_bonus: 0.2          # [-] 정면(y=0)을 포함하는 gap에 주는 bonus. 너무 크면 코너에서도 직진 성향이 남을 수 있다.

    # =========================
    # TARGET / SMOOTHING
    # =========================
    gf_target_point_scale: 1.0         # [-] target angle을 steering으로 바꿀 때 곱하는 계수. 조향 민감도를 전체적으로 조정할 때 사용한다.
    gf_use_steer_smoothing: true       # [bool] 이전 steering을 섞어 jitter를 줄인다.
    gf_steer_smoothing_alpha: 0.45     # [-] 1에 가까울수록 이전 조향을 더 오래 유지한다. 흔들림 억제에는 좋지만 코너 반응은 조금 늦어진다.

    # =========================
    # VEHICLE GEOMETRY
    # =========================
    vehicle_width: 0.30                # [m] true gap 폭 계산에 직접 들어가는 차량 폭. 실제 차보다 작게 잡으면 위험하다.
    vehicle_length: 0.50               # [m] RViz footprint 표시용 길이. 현재 gap 계산에는 직접 쓰이지 않는다.

    # =========================
    # VISUALIZATION / DEBUG
    # =========================
    viz_frame: base_link               # marker를 표시할 기준 프레임.
    viz_gap_fov_topic: /gf/gap_fov_marker  # gap 탐색용 넓은 FOV 경계선.
    viz_nearest_fov_topic: /gf/nearest_fov_marker  # nearest obstacle 탐색용 좁은 FOV 경계선.
    viz_nearest_point_topic: /gf/nearest_point_marker  # bubble 중심으로 선택된 obstacle 위치.
    viz_bubble_topic: /gf/bubble_marker  # bubble 각도 범위 표시.
    viz_gap_topic: /gf/gap_marker      # 최종 선택된 gap의 시작/끝 점.
    viz_gap_center_topic: /gf/gap_center_marker  # 선택 gap의 중심점.
    viz_target_topic: /gf/target_marker  # 실제 steering이 향하는 target 방향.
    viz_footprint_topic: /gf/footprint_marker  # gap 폭 판단 기준이 되는 차량 footprint.
    viz_fov_line_width: 0.05           # [m] FOV 경계선 두께.
    viz_gap_endpoint_size: 0.18        # [m] gap endpoint marker 크기.
    debug_log_every_n: 10              # [cycle] 몇 루프마다 GAP 로그를 남길지. 값이 작을수록 분석은 쉽지만 로그가 많아진다.

    # =========================
    # WHEN TO USE / HOW TO TUNE
    # =========================
    # 사용하기 좋은 경우:
    # - waypoint 없이 LiDAR만으로 빠르게 반응 주행하고 싶을 때
    # - 복도/트랙처럼 전방 free space 구조가 비교적 명확할 때
    # - 정교한 경로 추종보다 "우선 부딪히지 않고 지나가는 것"이 중요할 때
    #
    # 예상 가능한 상황과 우선 조정할 파라미터:
    # - 급코너에서 바깥으로 밀리며 늦게 꺾임:
    #   `gf_corner_lookahead`를 더 줄이거나, `gf_lookahead_max`를 더 낮추고, 필요하면 `gf_gap_fov_deg`를 조금 더 넓힌다.
    # - 직선에서 좌우로 흔들림(jitter)이 큼:
    #   `gf_steer_smoothing_alpha`를 올리고, `gf_speed`를 약간 낮추며, 필요하면 `gf_gap_heading_weight`를 조금 키운다.
    # - 지나치게 보수적이라 gap을 못 찾고 자주 멈춤:
    #   `gf_bubble_radius`, `gf_vehicle_safety_margin`, `gf_min_gap_beams`를 순서대로 조금씩 낮춰 본다.
    # - 옆 벽까지 bubble로 잡혀서 gap이 이상하게 지워짐:
    #   `gf_nearest_fov_deg`를 줄이거나 `gf_obstacle_max_center_angle_deg`를 더 줄여 정면 장애물만 bubble 중심으로 쓰게 한다.
    # - 코너인데도 자꾸 정면 gap을 고집함:
    #   `gf_forward_gap_bonus`를 더 낮추거나 `gf_gap_heading_weight`를 낮춰 코너 방향 gap 선택을 덜 억제한다.
    # - 장애물 회피가 너무 늦음:
    #   `gf_obstacle_trigger_dist`를 키우고, 필요하면 `gf_safe_distance`를 키워 더 일찍 감속하게 만든다.
    # - 좁은 길을 공격적으로 통과하고 싶음:
    #   `gf_vehicle_safety_margin`과 `gf_bubble_radius`를 아주 조금만 줄인다. 다만 실제 차량 폭보다 낙관적으로 잡으면 충돌 위험이 커진다.


wall_follow:
  ros__parameters:
    control_rate_hz: 50.0              # [Hz] 제어 루프 주기. 50Hz = 0.02초마다 실행.

    # =========================
    # E-STOP
    # =========================
    estop_stop_distance: 0.8           # [m] 이 거리보다 가까운 장애물이 있으면 즉시 정지. wall-follow는 벽 가까이 가므로 gap-follow보다 조금 크게 둘 수도 있음.
    estop_fov_deg: 10.0                # [deg] E-stop 전방 감시 범위. 너무 넓으면 벽을 장애물로 과민하게 볼 수 있어 좁게 둔 경우.
    estop_ttc_threshold: 0.35          # [s] TTC 기준 시간.
    estop_max_range: 10.0              # [m] E-stop 계산 최대 거리.
    estop_min_speed: 0.1               # [m/s] 매우 저속일 때 TTC 민감도를 낮추는 기준 속도.

    # =========================
    # WALL FOLLOW
    # =========================
    wf_target_dist: 0.6                # [m] 벽과 유지할 목표 거리.
    wf_kp: 1.4                         # [rad/m] 비례 이득(P). 현재 오차에 대한 반응 크기. 너무 출렁이면 낮춤.
    wf_kd: 0.09                        # [rad/(m/s)] 미분 이득(D). 오차 변화 속도에 반응해 진동을 줄이는 역할. 너무 작으면 효과 없고, 너무 크면 둔해질 수 있음.
    wf_ki: 0.01                        # [rad/(m·s)] 적분 이득(I). 오랜 시간 누적된 거리 오차를 보정. 너무 크면 누적되어 갑자기 크게 꺾을 수 있음.
    wf_speed: 2.0                      # [m/s] 기본 wall-follow 주행 속도.
    wf_max_steer: 0.6                  # [rad] wall-follow 최대 조향각.
    wf_lookahead: 0.4                  # [m] 미래 벽 거리 예측을 위한 lookahead 거리.
    wf_min_speed: 0.55                 # [m/s] 너무 느려지지 않도록 하는 최소 속도.

    # =========================
    # GEOMETRY
    # =========================
    wf_theta_deg: 50.0                 # [deg] wall-follow 두 라이다 빔 간 각도.
    wf_angle_b_deg: -90.0              # [deg] 기준 벽 방향 라이다 빔 각도. -90도면 오른쪽 옆면.
    wf_front_angle_deg: 0.0            # [deg] 정면 거리 확인용 각도.
    wf_front_right_angle_deg: -20.0    # [deg] 정면-오른쪽 방향 확인용 각도. 코너/벽 접근 판단에 사용 가능.

    # =========================
    # CORNER HANDLING
    # =========================
    corner_enter_a_threshold: 4.7      # [m] 특정 방향의 벽 거리 a가 이 값 이상이면 코너 진입으로 해석할 수 있는 기준.
    corner_exit_a_threshold: 4.1       # [m] 코너를 빠져나올 때 사용할 종료 기준 거리.
    corner_front_threshold: 1.5        # [m] 정면 거리가 이 값보다 짧으면 코너/급회전 판단에 활용 가능.
    corner_b_threshold: 2.2            # [m] 옆 벽 거리 b 기준. 코너 상황 판단에 사용.

    corner_sharp_steer: -0.30          # [rad] 급한 코너에서 사용할 강한 조향 명령.
    corner_sharp_speed: 0.40           # [m/s] 급한 코너에서 사용할 낮은 속도.
    corner_medium_steer: -0.24         # [rad] 중간 정도 코너에서 사용할 조향 명령.
    corner_medium_speed: 0.48          # [m/s] 중간 정도 코너에서 사용할 속도.
    corner_soft_steer: -0.16           # [rad] 완만한 코너에서 사용할 조향 명령.
    corner_soft_speed: 0.55            # [m/s] 완만한 코너에서 사용할 속도.

    # =========================
    # CLAMP
    # =========================
    integral_clip: 0.20                # [rad] 적분항(I term) 최대 제한값. 적분 누적 폭주(windup)를 막기 위한 제한.
    derivative_clip: 3.0               # [rad/s] 미분항(D term) 최대 제한값. 순간적인 노이즈로 D가 너무 커지는 것을 방지.

    # =========================
    # SMOOTHING
    # =========================
    steer_smoothing_alpha: 0.18        # [-] 조향 저역통과필터 계수. 값을 키우면 더 최근 명령을 많이 반영하고, 너무 낮으면 반응이 둔해질 수 있음.
    speed_smoothing_alpha: 0.20        # [-] 속도 저역통과필터 계수. 속도 변화가 너무 급하면 조정.

    viz_gap_line_width: 0.12
    viz_gap_endpoint_size: 0.20
