gap_follow:
  ros__parameters:
    # =========================================================
    # 기본 제어 설정
    # =========================================================
    control_rate_hz:  50.0    # [Hz] 제어 루프 실행 주기
    gf_speed:         5.5     # [m/s] 직선 최고 속도
    gf_min_speed:     1.2     # [m/s] 코너 등 감속 시 최저 속도 하한
    gf_max_steer:     0.68    # [rad] 조향각 상한 (클수록 급격한 코너 반응 가능)

    # =========================================================
    # LiDAR 탐색 범위 설정
    # =========================================================
    gf_max_range:    5.5      # [m] Gap 탐색 최대 거리 (클수록 더 먼 Gap 조기 인식)
    gf_fov_deg:       170.0   # [deg] 탐색 시야각 (좁힐수록 직선 주행 시 측면 벽 노이즈 감소)

    # =========================================================
    # Bubble 마스킹 (장애물 주변 안전 영역 설정)
    # =========================================================
    gf_use_bubble:    True    # True: 가장 가까운 장애물 기준 Bubble 마스킹 활성화
    gf_bubble_radius: 0.20    # [m] Bubble 반경 (작을수록 코너를 타이트하게 통과)

    # =========================================================
    # Gap 탐지 기준
    # =========================================================
    gf_gap_distance_threshold: 3.0   # [m] 이 거리 이상 열려 있어야 Gap으로 인식 (낮을수록 좁은 코너도 Gap으로 인식)
    gf_gap_half_beam_count:    1000  # [index] Gap 판단에 사용할 빔 수 (0이면 gf_fov_deg 전체 사용)

    # =========================================================
    # 동적 Gap 중심 이동 (조향각에 따라 탐색 중심 이동)
    # =========================================================
    gf_gap_use_dynamic_center:    true   # True: 현재 조향 방향으로 Gap 탐색 중심 이동
    gf_gap_center_gain:           1.0    # 이전 조향각 × gain 만큼 중심 이동 (클수록 적극적으로 이동)
    gf_gap_max_center_shift_deg:  35.0  # [deg] 동적 중심 이동 최대 허용 각도

    # =========================================================
    # 커브(Turn) 감지 로직
    # 정면과 좌/우 측면의 openness를 비교해 커브 여부를 판단.
    # =========================================================
    gf_turn_hint_center_deg:     10.0   # [deg] 정면 openness 측정에 사용할 중앙 섹터 폭
    gf_turn_hint_side_start_deg: 15.0   # [deg] 측면 openness 측정 시작 각도
    gf_turn_hint_side_end_deg:   85.0   # [deg] 측면 openness 측정 끝 각도
    gf_turn_open_ratio:          1.05   # 측면 openness가 정면 대비 이 배 이상이면 커브 후보로 간주
    gf_turn_diff_min:            0.15   # [m] 좌/우 openness 최소 차이 (이 이상 차이나야 커브 방향 확정)
    gf_turn_confidence_gain:     1.85   # 커브 확신도 누적 속도 (클수록 빠르게 커브로 확정)

    # =========================================================
    # 커브 진입 시 Gap 탐색 조정
    # =========================================================
    gf_corner_opposite_beam_scale: 0.45  # 커브 반대 방향 빔 차단 비율 (작을수록 더 많이 차단 → 커브 안쪽 집중)
    gf_corner_center_shift_deg:    24.0  # [deg] 커브 확정 시 Gap 탐색 중심 추가 이동 각도
    gf_corner_target_bias:         0.72  # 커브 시 목표점 Gap 내 위치 (0.5=중앙, 1.0=바깥쪽 끝)

    # =========================================================
    # 속도 제어 (감속 / 가속 로직)
    # =========================================================
    # -- 커브 감속 --
    gf_brake_distance:  6.5   # [m] 전방 장애물까지 이 거리 이하이면 감속 시작 (클수록 더 일찍 감속)

    # -- 커브 시 탐색 범위 축소 --
    gf_turn_max_range_reduction: 0.9   # [m] 커브 확신도에 비례해 gf_max_range를 최대 이만큼 줄임

    # -- 정면 개방도 기반 직선 가속 --
    gf_front_speed_check_angle_deg:  20.0   # [deg] 정면 안전 거리 계산에 사용할 각도 범위
    gf_front_safe_speed_up_distance: 2.2    # [m] 정면 평균 거리가 이 이상이면 추가 가속 허용
    gf_front_safe_speed_up_gain:     0.85   # [-] 정면 개방 시 속도 boost 강도

    # -- 목표 Gap 거리 기반 직선 가속 --
    gf_target_speed_boost_start_ratio: 0.3   # 선택된 Gap까지 거리가 gf_max_range의 이 비율 이상이면 가속 보너스 시작
    gf_target_speed_boost_gain:        0.80  # 가속 보너스 강도

    # =========================================================
    # 조향 PID 제어
    # =========================================================
    gf_kp: 0.80   # 비례(P): 오차에 비례한 즉각 반응 (낮출수록 부드러워짐)
    gf_ki: 0.00   # 적분(I): 누적 오차 보정 (지그재그 방지를 위해 기본 0)
    gf_kd: 0.25   # 미분(D): 오차 변화율 억제 (높일수록 급격한 조향 변화 완화)

    # =========================================================
    # 시각화 (RViz 토픽 설정)
    # =========================================================
    viz_frame:              base_link
    viz_gap_topic:          /gf/gap_marker
    viz_bubble_topic:       /gf/bubble_marker
    viz_gap_center_topic:   /gf/gap_center_marker
    viz_target_point_topic: /gf/target_point_marker
    viz_target_line_topic:  /gf/target_line_marker


wall_follow:
  ros__parameters:
    control_rate_hz: 50.0   # [Hz] 제어 루프 실행 주기

    # =========================================================
    # E-STOP (긴급 정지 조건)
    # 전방 일정 각도 내에서 장애물이 TTC 기준 이하로 접근하면 즉시 정지.
    # =========================================================
    estop_stop_distance:  0.2    # [m] 정지 판정 최소 거리 (이 이하면 즉시 정지)
    estop_fov_deg:        30.0   # [deg] E-Stop 감지 전방 시야각
    estop_ttc_threshold:  0.25   # [s] 충돌 예상 시간(TTC) 하한 (이 이하면 즉시 정지)
    estop_max_range:      10.0   # [m] E-Stop 감지 최대 거리
    estop_min_speed:      0.1    # [m/s] E-Stop 발동 최소 속도 (이 이하 속도에서는 무시)

    # =========================================================
    # Wall Follow 기본 제어
    # 오른쪽 벽과의 거리를 PID로 제어.
    # 2개 레이(b: 90°, a: 90°-theta)의 거리로 벽 수직 거리 추정.
    # =========================================================
    wf_target_dist: 0.8    # [m] 오른쪽 벽과 유지할 목표 거리
    wf_speed:       1.5    # [m/s] 기본 주행 속도
    wf_max_steer:   0.4    # [rad] 최대 조향각 상한
    wf_lookahead:   0.5    # [m] 예측 lookahead 거리 (클수록 미리 보정)
    wf_min_speed:   0.55   # [m/s] 속도 하한

    # =========================================================
    # PID 제어 게인 (벽과의 거리 오차 → 조향각)
    # =========================================================
    wf_kp: 1.0    # 비례(P): 오차에 비례한 즉각 반응
    wf_kd: 0.1    # 미분(D): 오차 변화율 억제 (높이면 진동 감소, 너무 높으면 발산)
    wf_ki: 0.01   # 적분(I): 정상 상태 오차 제거 (너무 높으면 windup 발생)

    # =========================================================
    # LiDAR 레이 각도 설정
    # =========================================================
    wf_theta_deg:             50.0    # [deg] 벽 거리 추정에 사용할 두 레이 사이 각도
    wf_angle_b_deg:           -90.0   # [deg] 레이 b 각도 (우측 수직 방향)
    wf_front_angle_deg:        0.0    # [deg] 전방 감지 레이 각도
    wf_front_right_angle_deg: -20.0   # [deg] 전방 우측 감지 레이 각도

    # =========================================================
    # 코너 처리 (Corner Handling)
    # 전방(a)/측면(b) 레이 거리로 코너 진입·탈출 판단 후
    # 곡률에 따라 sharp/medium/soft 3단계로 고정 steer/speed 명령.
    # =========================================================
    corner_enter_a_threshold:  5      # [m] 전방 레이(a) 거리 > 이 값 → 코너 진입 감지 시작
    corner_exit_a_threshold:   5      # [m] 전방 레이(a) 거리 < 이 값 → 코너 탈출 감지
    corner_front_threshold:    1.5    # [m] 전방 거리 이하이면 코너로 판단
    corner_b_threshold:        0.5    # [m] 측면 거리 이하이면 코너로 판단

    # 급코너 (sharp): 전방이 막히고 벽이 매우 가까울 때
    corner_sharp_steer:  -0.30   # [rad] 조향각
    corner_sharp_speed:   0.40   # [m/s] 속도

    # 중간 코너 (medium)
    corner_medium_steer: -0.24
    corner_medium_speed:  0.48

    # 완만한 코너 (soft)
    corner_soft_steer:   -0.16
    corner_soft_speed:    0.55

    # =========================================================
    # PID 항 제한 (Clamp)
    # =========================================================
    integral_clip:   0.20   # 적분(I) 항 포화 방지 상한 (windup 방지)
    derivative_clip: 3.0    # 미분(D) 항 발산 방지 상한

    # =========================================================
    # 출력 스무딩 (EMA: Exponential Moving Average)
    # alpha 낮을수록 강한 스무딩 → 부드럽지만 반응 느림
    # alpha 높을수록 약한 스무딩 → 빠른 반응이지만 떨림 증가
    # =========================================================
    steer_smoothing_alpha: 0.18   # 조향각 EMA 계수
    speed_smoothing_alpha: 0.20   # 속도 EMA 계수